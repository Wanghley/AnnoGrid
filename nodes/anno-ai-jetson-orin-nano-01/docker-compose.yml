version: '3.8'

# LEGACY TEMPLATE — DO NOT DEPLOY. The live stack for this node (ai-jacaranda) is
# docker/ai-jetson-orin/ + docker/shared/monitoring/. The node-exporter below has the same
# container_name as the live one and would collide with it.

# AI/ML Workload Node (anno-ai-jetson-orin-nano-01)
# NVIDIA Jetson Orin Nano (8GB RAM, 128GB NVMe)
# Purpose: GPU-accelerated machine learning inference and processing

services:
  # Node Exporter - Prometheus metrics (includes GPU stats)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - annogrid-net
    labels:
      - "com.annogrid.component=monitoring"
      - "com.annogrid.node=anno-ai-jetson-orin-nano-01"

  # Example: TensorFlow Serving (Model Inference)
