# Ships THIS node's own logs into the local Loki (loki:3100 — same docker
# network, no Tailscale hop needed). Edge nodes run their own promtail
# sidecar (docker/shared/general/setup-node.sh) pointed at
# ${TAILSCALE_IP}:3100 to ship theirs here.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /data/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    external_labels:
      host: ${GATEWAY_ID}

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log

  - job_name: docker
    pipeline_stages:
      - docker: {}
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
