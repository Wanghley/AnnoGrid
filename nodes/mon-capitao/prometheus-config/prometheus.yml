# Prometheus config for anno-gw-mon-rpi3bp-01.
#
# This node IS the metrics hub — it scrapes everyone else over Tailscale and
# stores locally. It does NOT remote_write anywhere else; there is no
# "more central" Prometheus in this cluster (see docs/architecture/
# cluster-architecture.md: "Run metrics collection locally, no remote
# scraping"). If that ever changes, add a `remote_write:` block back here.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: annogrid
    node: mon-capitao

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: mon-capitao

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: mon-capitao
          role: gateway-monitoring

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: mon-capitao
          role: gateway-monitoring

  # Peer nodes over Tailscale. Targets live in targets/cluster-nodes.yml —
  # Prometheus watches that file and hot-reloads it on change, no restart
  # or container rebuild needed to add/edit a peer.
  - job_name: cluster-nodes
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/cluster-nodes.yml
        refresh_interval: 1m
