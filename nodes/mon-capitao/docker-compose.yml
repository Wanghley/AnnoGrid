name: anno-gw-mon-rpi3bp-01

# Monitoring Node (anno-gw-mon-rpi3bp-01) — Raspberry Pi 3B+, 1GB RAM
# Purpose: metrics (Prometheus) + logs (Loki) + alerting (Alertmanager) for
# the whole cluster, plus the read-only docker socket-proxy the Homepage
# dashboard on another node uses to show this node's containers.
#
# Grafana deliberately does NOT run here — it lives on the gateway VPS
# (nodes/anno-gw-vps-macauba-01/), which has more headroom and sits next to
# the Cloudflare tunnel that serves it publicly. Grafana there reaches this
# Pi's Prometheus (:9090) and Loki (:3100) over Tailscale as remote
# datasources. This Pi has no cloudflared of its own and nothing it runs is
# ever reachable from the plain internet — only from inside the tailnet.
#
# Every service below carries a hard memory ceiling — this box only has
# ~700MB usable after the OS. Ceilings are safety limits, not reservations;
# actual steady-state usage should sit well under them. Enable zram
# (see scripts/gateway-monitoring/gateway-node-setup.sh --enable-zram) as a
# swap backstop.
#
# All published ports bind to ${TAILSCALE_IP} only, never 0.0.0.0 — nothing
# here should be reachable from the plain LAN.

services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker|run/docker)($$|/)'
    networks:
      - mon-capitao
    deploy:
      resources:
        limits:
          memory: 48M
    labels:
      - "com.annogrid.component=monitoring"
      - "com.annogrid.node=mon-capitao"
      - "homepage.group=anno-gw"
      - "homepage.name=Node Exporter"
      - "homepage.icon=mdi-server-network"
      - "homepage.description=Host metrics exporter"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - '-docker_only'
      - '-housekeeping_interval=30s'
      - '-disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl'
    networks:
      - mon-capitao
    deploy:
      resources:
        limits:
          memory: 96M
    labels:
      - "com.annogrid.component=monitoring"
      - "com.annogrid.node=mon-capitao"
      - "homepage.group=anno-gw"
      - "homepage.name=cAdvisor"
      - "homepage.icon=mdi-docker"
      - "homepage.description=Container metrics"

  # Read-only docker socket proxy — consumed cross-host by Homepage
  # (docker/homepage/config/docker.yaml) to list this node's containers.
  docker-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      SERVICES: 1
      TASKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${TAILSCALE_IP}:2375:2375"
    read_only: true
    tmpfs:
      - /run
    networks:
      - mon-capitao
    deploy:
      resources:
        limits:
          memory: 32M

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "${TAILSCALE_IP}:9090:9090"
    volumes:
      - ./prometheus-config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-config/rules:/etc/prometheus/rules:ro
      - ./prometheus-config/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=512MB'
      - '--web.enable-lifecycle'
    networks:
      - mon-capitao
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      - "com.annogrid.component=monitoring"
      - "com.annogrid.node=mon-capitao"

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    ports:
      - "${TAILSCALE_IP}:3100:3100"
    volumes:
      - ./loki-config/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    command:
      - '-config.file=/etc/loki/loki-config.yml'
    networks:
      - mon-capitao
    deploy:
      resources:
        limits:
          memory: 160M
    labels:
      - "com.annogrid.component=monitoring"
      - "com.annogrid.node=mon-capitao"

  # Ships this node's own logs into the local Loki. Edge nodes run the
  # sidecar in docker/shared/monitoring/ pointed at ${TAILSCALE_IP}:3100
  # to ship theirs.
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: always
    environment:
      - GATEWAY_ID=${GATEWAY_ID}
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./loki-config/promtail-config.yml:/etc/promtail/config.yml:ro
      - promtail-data:/data
    command:
      - '-config.file=/etc/promtail/config.yml'
      - '-config.expand-env=true'
    depends_on:
      - loki
    networks:
      - mon-capitao
    deploy:
      resources:
        limits:
          memory: 64M
    labels:
      - "com.annogrid.component=monitoring"
      - "com.annogrid.node=mon-capitao"

  # Grafana does NOT run here — it moved to nodes/anno-gw-vps-macauba-01/
  # (more headroom there, and it's next to the Cloudflare tunnel that
  # serves it publicly). It reaches this Pi's Prometheus/Loki over
  # Tailscale. See that node's README for the datasource wiring.

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: always
    ports:
      - "${TAILSCALE_IP}:9093:9093"
    volumes:
      - ./alertmanager-config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - mon-capitao
    deploy:
      resources:
        limits:
          memory: 48M
    labels:
      - "com.annogrid.component=monitoring"
      - "com.annogrid.node=mon-capitao"

networks:
  # No fixed subnet: a hardcoded 172.20.0.0/16 collided with another
  # network's pool already on this host ("invalid pool request: Pool
  # overlaps with other one on this address space"). Let Docker pick
  # from its default address pools instead.
  #
  # `name:` forces the actual docker network to be called exactly
  # "mon-capitao" instead of the compose-default "<project>_mon-capitao".
  mon-capitao:
    name: mon-capitao
    driver: bridge

volumes:
  prometheus-data:
  loki-data:
  promtail-data:
  alertmanager-data:
