server {
    listen 8091;
    server_name _;

    # sub_filter only works on uncompressed bodies — force Grafana to
    # respond without gzip so the injected <style> tag actually lands.
    proxy_set_header Accept-Encoding "";

    # Standard proxy headers + WebSocket passthrough (Grafana Live uses
    # websockets for some panels; harmless to keep even if this specific
    # embed doesn't need it).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    location / {
        proxy_pass http://grafana:3000;

        # Only touch HTML responses — JS/CSS/API/JSON pass through
        # completely untouched.
        sub_filter_types text/html;
        sub_filter_once off;

        # Hide the "Powered by Grafana" badge (class confirmed from the
        # live d-solo panel's rendered DOM).
        sub_filter '</head>' '<style>.css-y6esvy{display:none!important}</style></head>';
    }
}
