services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:lts
    restart: always
    command: --http-enabled
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "0.0.0.0:9443:9443"
      - "0.0.0.0:9002:9000"
      - "0.0.0.0:8000:8000"
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m
    ulimits:
      nproc: 65535
      nofile:
        soft: 1024
        hard: 65535
    labels:
      homepage.group: anno-app
      homepage.name: Portainer
      homepage.icon: portainer.png
      homepage.href: "https://100.67.194.10:9443"
      homepage.description: Container management
      homepage.server: anno-app
      homepage.container: portainer
    networks:
      - default
      - annogrid
volumes:
  portainer_data:
    name: portainer_data
networks:
  default:
    name: portainer_network
  annogrid:
    name: annogrid
    external: true
