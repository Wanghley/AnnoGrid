# n8n with external task runner
# Optimized for Orange Pi 3B (ARM64 memory constraints)

x-shared-env: &shared-env
  N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      <<: *shared-env

      # ---- Database (anno-db-oci-01, over Tailscale) ----
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${DB_POSTGRESDB_HOST}
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE}
      DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER}
      DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD}

      # ---- Core n8n ----
      N8N_HOST: n8n.wanghley.com
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: https://n8n.wanghley.com/
      N8N_PROXY_HOPS: 1
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # ---- Storage ----
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem

      # ---- Task runners (external mode) ----
      # N8N_RUNNERS_ENABLED is deprecated/no-op on n8n 2.0+ but still required
      # on 1.x - set defensively since we're on a floating :stable tag.
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_BROKER_PORT: 5679

      # ---- Timezone ----
      GENERIC_TIMEZONE: America/New_York
      TZ: America/New_York

      # ---- Performance & Garbage Collection for 2GB RAM Limit ----
      NODE_OPTIONS: --max-old-space-size=1024 --max-semi-space-size=16
      NODE_ENV: production
      NODE_FUNCTION_ALLOW_BUILTIN: buffer
      NPM_CONFIG_UPDATE_NOTIFIER: "false"

      # ---- Hardening ----
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_SECURE_COOKIE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_storage:/home/node/.n8n
    networks:
      - shared
    expose:
      - "5679"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  n8n-runner:
    image: n8nio/runners:stable
    container_name: n8n-runner
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      <<: *shared-env
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      NODE_OPTIONS: --max-old-space-size=512
      NODE_ENV: production
    networks:
      - shared
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  n8n_storage:
    name: N8n-n8n_storage
    external: true  # Ties directly to your existing N8n volume

networks:
  shared:
    external: true  # Shared network (created by ../application-server/setup.sh); DB reached remotely over Tailscale
