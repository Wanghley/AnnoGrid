name: peekaping

services:
  gateway:
    image: nginx:alpine
    container_name: peekaping-gateway
    ports:
      - "8085:80"  # Your external reverse proxy or Tailscale should point here
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - annogrid
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.2"

  web:
    image: 0xfurai/peekaping-web:latest
    container_name: peekaping-web
    depends_on:
      api:
        condition: service_healthy
    networks:
      - annogrid
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 2s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 48M
          cpus: "0.2"

  migrate:
    image: 0xfurai/peekaping-migrate:latest
    container_name: peekaping-migrate
    environment:
      - DB_TYPE=postgres
      - DB_HOST=${PEEKAPING_DB_HOST}
      - DB_PORT=${PEEKAPING_DB_PORT}
      - DB_USER=${PEEKAPING_DB_USER}
      - DB_PASS=${PEEKAPING_DB_PASSWORD}
      - DB_NAME=${PEEKAPING_DB_NAME}
    networks:
      - annogrid
    restart: "no"

  api:
    image: 0xfurai/peekaping-api:latest
    container_name: peekaping-api
    environment:
      - DB_TYPE=postgres
      - DB_HOST=${PEEKAPING_DB_HOST}
      - DB_PORT=${PEEKAPING_DB_PORT}
      - DB_USER=${PEEKAPING_DB_USER}
      - DB_PASS=${PEEKAPING_DB_PASSWORD}
      - DB_NAME=${PEEKAPING_DB_NAME}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASS}
      - MODE=${MODE}
      - TZ=${TZ}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - annogrid
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO - http://localhost:8034/api/v1/health || exit 1"]
      interval: 30s
      timeout: 2s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: "0.4"

  producer:
    image: 0xfurai/peekaping-producer:latest
    container_name: peekaping-producer
    environment:
      - DB_TYPE=postgres
      - DB_HOST=${PEEKAPING_DB_HOST}
      - DB_PORT=${PEEKAPING_DB_PORT}
      - DB_USER=${PEEKAPING_DB_USER}
      - DB_PASS=${PEEKAPING_DB_PASSWORD}
      - DB_NAME=${PEEKAPING_DB_NAME}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASS}
      - MODE=${MODE}
      - TZ=${TZ}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - annogrid
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  worker:
    image: 0xfurai/peekaping-worker:latest
    container_name: peekaping-worker
    environment:
      - DB_TYPE=postgres
      - DB_HOST=${PEEKAPING_DB_HOST}
      - DB_PORT=${PEEKAPING_DB_PORT}
      - DB_USER=${PEEKAPING_DB_USER}
      - DB_PASS=${PEEKAPING_DB_PASSWORD}
      - DB_NAME=${PEEKAPING_DB_NAME}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASS}
      - MODE=${MODE}
      - TZ=${TZ}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - annogrid
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: "0.4"

  ingester:
    image: 0xfurai/peekaping-ingester:latest
    container_name: peekaping-ingester
    environment:
      - DB_TYPE=postgres
      - DB_HOST=${PEEKAPING_DB_HOST}
      - DB_PORT=${PEEKAPING_DB_PORT}
      - DB_USER=${PEEKAPING_DB_USER}
      - DB_PASS=${PEEKAPING_DB_PASSWORD}
      - DB_NAME=${PEEKAPING_DB_NAME}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASS}
      - MODE=${MODE}
      - TZ=${TZ}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - annogrid
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

networks:
  annogrid:
    external: true  # Shared network (created by ../application-server/setup.sh); DB reached remotely over Tailscale
