events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # 1. Route API payloads to the Go engine
        location /api/ {
            proxy_pass http://peekaping-api:8034;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. FIX: Route Real-Time WebSockets directly to the Go API Core
        location /socket.io/ {
            proxy_pass http://peekaping-api:8034;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Crucial Connection Upgrade Parameters for WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Prevent Nginx from prematurely cutting dead connection streams
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 3. Route everything else to the static Web UI wrapper
        location / {
            proxy_pass http://peekaping-web:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
