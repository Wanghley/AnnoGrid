networks:
  shared:
    external: true

volumes:
  monica_data:
  n8n_data:
  jellyfin_config:
  jellyfin_cache:
  uptime_kuma_data:

services:
  monica:
    image: monica:apache
    container_name: annogrid-monica
    restart: unless-stopped
    labels:
      homepage.group: anno-app
      homepage.name: Monica
      homepage.icon: monica.png
      homepage.href: "http://100.67.194.10:8080"
      homepage.description: Personal CRM
      homepage.server: anno-app
      homepage.container: annogrid-monica
    environment:
      APP_KEY: ${MONICA_APP_KEY}
      APP_URL: ${MONICA_URL}
      DB_HOST: ${ANNOGRID_DB_HOST}
      DB_DATABASE: monica
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - monica_data:/var/www/html/storage
    ports:
      - "8080:80"
    networks:
      - shared

  n8n:
    image: n8nio/n8n:latest
    container_name: annogrid-n8n
    restart: unless-stopped
    labels:
      homepage.group: anno-app
      homepage.name: n8n
      homepage.icon: n8n.png
      homepage.href: "http://100.67.194.10:5678"
      homepage.description: Workflow automation
      homepage.server: anno-app
      homepage.container: annogrid-n8n
    # NOTE: this n8n service looks superseded by the standalone stack in
    # ../n8n/docker-compose.yml (external N8n-n8n_storage volume). Confirm
    # which one is actually live before deploying both — see RESTORE.md.
    environment:
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${ANNOGRID_DB_HOST}
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_SECURE_COOKIE: false
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    networks:
      - shared

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: annogrid-jellyfin
    restart: unless-stopped
    labels:
      homepage.group: anno-app
      homepage.name: Jellyfin
      homepage.icon: jellyfin.png
      homepage.href: "http://100.67.194.10:8096"
      homepage.description: Media streaming
      homepage.server: anno-app
      homepage.container: annogrid-jellyfin
    environment:
      TZ: ${TZ}
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ${MEDIA_PATH}:/media:ro
    ports:
      - "8096:8096"
    networks:
      - shared

