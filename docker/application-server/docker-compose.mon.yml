networks:
  shared:
    external: true

services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: annogrid-node-exporter
    restart: unless-stopped
    pid: "host"
    volumes:
      - '/:/host:ro,rslave'
      - '/proc:/host/proc:ro'
      - '/sys:/host/sys:ro'
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containerd/.+)($$|/)'
    networks:
      - shared
    labels:
      homepage.group: anno-app
      homepage.name: Node Exporter
      homepage.icon: mdi-server-network
      homepage.href: "http://100.67.194.10:9100"
      homepage.description: Host metrics exporter
      homepage.server: anno-app
      homepage.container: annogrid-node-exporter

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: annogrid-cadvisor
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    networks:
      - shared
    labels:
      homepage.group: anno-app
      homepage.name: cAdvisor
      homepage.icon: mdi-docker
      homepage.href: "http://100.67.194.10:8082"
      homepage.description: Container metrics
      homepage.server: anno-app
      homepage.container: annogrid-cadvisor

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: annogrid-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${ANNOGRID_DB_HOST}:5432/${POSTGRES_DB}?sslmode=disable"
    networks:
      - shared
    labels:
      homepage.group: anno-app
      homepage.name: PG Exporter
      homepage.icon: postgresql.png
      homepage.description: PostgreSQL metrics
      homepage.server: anno-app
      homepage.container: annogrid-postgres-exporter

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: annogrid-mysqld-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(${ANNOGRID_DB_HOST}:3306)/"
    command:
      - "--config.my-cnf="
    networks:
      - shared
    labels:
      homepage.group: anno-app
      homepage.name: MySQL Exporter
      homepage.icon: mariadb.png
      homepage.description: MariaDB metrics
      homepage.server: anno-app
      homepage.container: annogrid-mysqld-exporter
