# DEPRECATED — local DB layer retired 2026-09-07
#
# postgres / mariadb / redis moved off anno-app-opi3bp-01 to a centralized
# DB host: docker/core-data/, deployed on anno-db-oci-01 (OCI VPS, reachable
# over Tailscale).
#
# See docs/guides/db-migration-to-oci.md for the migration, and
# docker/core-data/docker-compose.yml for where these services run now.
