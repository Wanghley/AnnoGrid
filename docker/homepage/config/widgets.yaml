- logo:
    icon: mdi-server-network

- greeting:
    text_size: 4xl
    text: AnnoGrid

- greeting:
    text_size: 4xl
    text: —

# ── Cluster health — all 4 nodes at a glance ─────────
- customapi:
    url: http://host.docker.internal:3033/static/stats.json
    refreshInterval: 30000
    display: list
    mappings:
      - field:
          anno_app:
            cpu
        label: "APP  cpu"
        format: text
        additionalField:
          field:
            anno_app:
              ram
          format: text
          prefix: "  ·  ram "
      - field:
          anno_ai:
            cpu
        label: "AI   cpu"
        format: text
        additionalField:
          field:
            anno_ai:
              ram
          format: text
          prefix: "  ·  ram "
      - field:
          anno_gw:
            cpu
        label: "GW   cpu"
        format: text
        additionalField:
          field:
            anno_gw:
              ram
          format: text
          prefix: "  ·  ram "
      - field:
          anno_nas:
            disk_pct
        label: "NAS  disk"
        format: text
        additionalField:
          field:
            anno_nas:
              storage_used
          format: text
          prefix: "  ·  used "

- greeting:
    text_size: 4xl
    text: —

# ── Local host (anno-app) detail ──────────────────────
- resources:
    expanded: false
    cpu: true
    memory: true
    refresh: 3000

- resources:
    label: DISK
    expanded: true
    disk:
      - /

- greeting:
    text_size: 4xl
    text: —

- resources:
    expanded: false
    uptime: true
    refresh: 5000

- datetime:
    text_size: 4xl
    format:
        timeStyle: short
        hour12: false

- datetime:
    text_size: md
    format:
        dateStyle: long
        hour12: false

- search:
    provider: duckduckgo
    focus: false
    showSearchSuggestions: true
    target: _parent

- openmeteo:
    label: Location
    latitude: 0.00
    longitude: 0.00
    timezone: America/Sao_Paulo
    units: metric
    cache: 5
    format:
      maximumFractionDigits: 0
