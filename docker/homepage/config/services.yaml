# STAT TAB
# Row 1 (33% each): anno-app · anno-ai · anno-nas
# Row 2 (33% each): anno-gw · Jellyfin Movies · Jellyfin Series
# Row 3 (50% each): Cluster Containers · Cluster Health
# Row 4 (100%):     System Alerts
########################################################################

- anno-app Stats:
    - _hidden:
        href: http://anno-app-opi3b-01.local
        widget:
          type: customapi
          url: http://host.docker.internal:3033/static/stats.json
          refreshInterval: 60000
          display: grid
          mappings:
            - field:
                anno_app:
                  cpu
              label: "CPU"
              format: text
            - field:
                anno_app:
                  ram
              label: "RAM"
              format: text
            - field:
                anno_app:
                  disk
              label: "Disk /"
              format: text
            - field:
                anno_app:
                  uptime
              label: "Uptime"
              format: text

