########################################################################
# HOME TAB
# Row 1 (25% each): Media · Automation · AI · Personal
# Row 2 (20% each): Management · Monitoring · _hidden0 · _hidden1
########################################################################

- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: "{{HOMEPAGE_VAR_JELLYFIN_URL}}"
        container: annogrid-jellyfin
        server: anno-app
        description: Multimedia streaming library
        widget:
            type: jellyfin
            url: http://host.docker.internal:8096
            key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
            enableBlocks: true
            enableNowPlaying: true
            fields: ["movies", "series", "songs"]

