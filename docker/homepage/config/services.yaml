########################################################################
- Cluster Containers:
    - _hidden:
        href: https://anno-app-opi3b-01.local:9443
        widget:
          type: customapi
          url: http://host.docker.internal:3033/static/stats.json
          refreshInterval: 30000
          display: grid
          mappings:
            - field:
                cluster:
                  running
              label: "Running"
              format: number
            - field:
                cluster:
                  stopped
              label: "Stopped"
              format: number
            - field:
                cluster:
                  total
              label: "Total"
              format: number
            - field:
                cluster:
                  hosts
              label: "Hosts"
              format: number

########################################################################
- Cluster Health:
    - _hidden:
        href: https://anno-app-opi3b-01.local:9443
        widget:
          type: customapi
          url: http://host.docker.internal:3033/static/stats.json
          refreshInterval: 30000
          display: list
          mappings:
            - field:
                anno_app:
                  containers_up
              label: "anno-app"
              format: text
              additionalField:
                field:
                  anno_app:
                    containers_down
                format: text
                prefix: " running / "
                suffix: " stopped"
            - field:
                anno_ai:
                  containers_up
              label: "anno-ai"
              format: text
              additionalField:
                field:
                  anno_ai:
                    containers_down
                format: text
                prefix: " running / "
                suffix: " stopped"
            - field:
                anno_nas:
                  containers_up
              label: "anno-nas"
              format: text
              additionalField:
                field:
                  anno_nas:
                    containers_down
                format: text
                prefix: " running / "
                suffix: " stopped"
            - field:
                anno_gw:
                  containers_up
              label: "anno-gw"
              format: text
              additionalField:
                field:
                  anno_gw:
                    containers_down
                format: text
                prefix: " running / "
                suffix: " stopped"

