name: homepage

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: annogrid-homepage
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
      HOMEPAGE_VAR_PORTAINER_KEY: ${HOMEPAGE_VAR_PORTAINER_KEY}
      HOMEPAGE_VAR_JELLYFIN_KEY: ${HOMEPAGE_VAR_JELLYFIN_KEY}
      HOMEPAGE_VAR_GRAFANA_USER: ${HOMEPAGE_VAR_GRAFANA_USER}
      HOMEPAGE_VAR_GRAFANA_PASS: ${HOMEPAGE_VAR_GRAFANA_PASS}
      HOMEPAGE_VAR_LITELLM_PORT: ${HOMEPAGE_VAR_LITELLM_PORT}
      HOMEPAGE_VAR_OPEN_WEBUI_PORT: ${HOMEPAGE_VAR_OPEN_WEBUI_PORT}
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-*}
      # ── Production / external URLs (Cloudflare tunnel or reverse proxy) ──
      # Override in .env with your real domain; defaults to Tailscale IPs.
      HOMEPAGE_VAR_JELLYFIN_URL: ${JELLYFIN_URL:-http://100.67.194.10:8096}
      HOMEPAGE_VAR_N8N_URL: ${N8N_URL:-http://100.67.194.10:5678}
      HOMEPAGE_VAR_MONICA_URL: ${MONICA_URL:-http://100.67.194.10:8080}
      HOMEPAGE_VAR_TWENTY_URL: ${TWENTY_URL:-http://100.67.194.10:3000}
      HOMEPAGE_VAR_PORTAINER_URL: ${PORTAINER_URL:-https://100.67.194.10:9443}
      HOMEPAGE_VAR_GRAFANA_URL: ${GRAFANA_URL:-http://100.85.193.50:3001}
      HOMEPAGE_VAR_OPENWEBUI_URL: ${OPENWEBUI_URL:-http://100.85.193.50:8080}
      HOMEPAGE_VAR_LITELLM_URL: ${LITELLM_URL:-http://100.85.193.50:4000}
      HOMEPAGE_VAR_PROMETHEUS_URL: ${PROMETHEUS_URL:-http://100.85.193.50:9090}
      HOMEPAGE_VAR_ALERTMANAGER_URL: ${ALERTMANAGER_URL:-http://100.85.193.50:9093}
      HOMEPAGE_VAR_NETDATA_URL: ${NETDATA_URL:-http://100.114.225.52:19999}
      HOMEPAGE_VAR_HOMELABLE_URL: ${HOMELABLE_URL:-http://100.85.193.50:3002}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config:/app/config
      - ./public:/app/public/static
    ports:
      - "3033:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
