name: node-monitoring

services:

  docker-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      SERVICES: 1
      TASKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${TAILSCALE_IP}:2375:2375"
    read_only: true
    tmpfs:
      - /run

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    ports:
      - "${TAILSCALE_IP}:9100:9100"
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    command:
      - '--path.rootfs=/host'
      - '--web.listen-address=0.0.0.0:9100'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containerd/.+)($$|/)'
      - '--collector.netdev.device-exclude=^(lo|docker[0-9]+|br-.+|veth.+)$$'
    labels:
      homepage.group: anno-nas
      homepage.name: Node Exporter
      homepage.icon: mdi-server-network
      homepage.description: Host metrics exporter
      homepage.server: anno-nas
      homepage.container: node-exporter

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: always
    ports:
      - "${TAILSCALE_IP}:8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    # On ai-jacaranda (8 GB shared with the LLMs) cAdvisor showed >1 GB in `docker stats`. Its real
    # process memory is tiny (~16 MB); the rest is reclaimable kernel dentry/inode SLAB, charged to
    # its cgroup because it walks every container's filesystem to compute disk usage. On a Jetson
    # that cache competes with GPU allocations, so: the `disk` metric group (the du-style scan,
    # container_fs_usage_bytes) is off, plus 30s housekeeping, docker containers only and the
    # heavy per-CPU/scheduler/TCP groups off. cpu/memory/network/diskIO stay on. The hard cap
    # below bounds whatever cache remains.
    command:
      - '--housekeeping_interval=30s'
      - '--max_housekeeping_interval=60s'
      - '--docker_only=true'
      - '--storage_duration=1m'
      - '--disable_metrics=advtcp,cpu_topology,cpuset,disk,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp'
    environment:
      - GOMEMLIMIT=256MiB
    deploy:
      resources:
        limits:
          memory: 384M
    labels:
      homepage.group: anno-nas
      homepage.name: cAdvisor
      homepage.icon: mdi-docker
      homepage.href: "http://100.114.225.52:8080"
      homepage.description: Container metrics
      homepage.server: anno-nas
      homepage.container: cadvisor

  netdata:
    image: netdata/netdata:latest
    container_name: netdata
    restart: always
    network_mode: "host"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      homepage.group: anno-nas
      homepage.name: Netdata
      homepage.icon: netdata.png
      homepage.href: "http://100.114.225.52:19999"
      homepage.description: Real-time system monitoring
      homepage.server: anno-nas
      homepage.container: netdata

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: always
    environment:
      - GATEWAY_IP=${GATEWAY_IP}
      - NODE_NAME=${NODE_NAME}
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail-config.yml:/etc/promtail/config.yml
    command:
      - -config.file=/etc/promtail/config.yml
      - -config.expand-env=true
      - -client.external-labels=host=${NODE_NAME}
    labels:
      homepage.group: anno-nas
      homepage.name: Promtail
      homepage.icon: grafana.png
      homepage.description: Log shipping agent
      homepage.server: anno-nas
      homepage.container: promtail

volumes:
  netdatalib:
  netdatacache:
