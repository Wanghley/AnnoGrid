# core-data — Centralized Database Server
#
# Consolidates Postgres, MariaDB, Redis, and MinIO for every AnnoGrid stack
# that used to run its own local DB containers (docker/application-server/
# docker-compose.db.yml on anno-app-opi3bp-01, and this stack's own
# pre-2026-09-07 local deployment). Now deployed on anno-db-oci-01 (OCI VPS)
# — see docs/guides/db-migration-to-oci.md and
# ../../nodes/anno-db-oci-01/README.md for that node's specifics.
#
# SECURITY: every port below is bound to ${TAILSCALE_IP} only — never to
# 0.0.0.0 — so these databases are unreachable except over the tailnet.
# Do NOT open 5432/3306/6379/9000/9001 in the host's cloud firewall.

name: core-data

networks:
  core-data:
    driver: bridge

volumes:
  # Explicit `name:` (same as the key) so these are bare "postgres_data" etc
  # with no compose-project prefix — matches the tarball names coming off
  # a recovered SD card 1:1, no renaming needed during restore.
  postgres_data:
    name: postgres_data
  mariadb_data:
    name: mariadb_data
  redis_data:
    name: redis_data
  minio_data:
    name: minio_data
  # mongodb_data:
  #   name: mongodb_data
  # Uncomment only if an SD-card extraction's MANIFEST.txt showed real data
  # in a mongo volume — the pre-migration core-data stack declared this
  # volume but had no mongo service using it.

services:
  postgres:
    image: postgres:18-alpine
    container_name: core-data-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./configs/postgres/init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "${TAILSCALE_IP}:5432:5432"
    networks:
      - core-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  mariadb:
    image: mariadb:11-jammy
    container_name: core-data-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./configs/mariadb/init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "${TAILSCALE_IP}:3306:3306"
    networks:
      - core-data
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: core-data-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${TAILSCALE_IP}:6379:6379"
    networks:
      - core-data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s

  minio:
    image: minio/minio:latest
    container_name: core-data-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${TAILSCALE_IP}:9000:9000"
      - "${TAILSCALE_IP}:9001:9001"
    networks:
      - core-data

  node-exporter:
    image: prom/node-exporter:latest
    container_name: core-data-node-exporter
    restart: unless-stopped
    pid: "host"
    volumes:
      - '/:/host:ro,rslave'
      - '/proc:/host/proc:ro'
      - '/sys:/host/sys:ro'
    ports:
      - "${TAILSCALE_IP}:9100:9100"
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containerd/.+)($$|/)'
    networks:
      - core-data
