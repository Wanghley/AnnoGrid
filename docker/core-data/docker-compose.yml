# core-data — Centralized Database Server
#
# Consolidates Postgres, MariaDB, Redis, CouchDB, and MinIO for every
# AnnoGrid stack that used to run its own local DB containers
# (docker/application-server/docker-compose.db.yml on anno-app-opi3bp-01,
# docker/obsidian/'s own local CouchDB, and this stack's own
# pre-2026-09-07 local deployment). Now deployed on anno-db-oci-01 (OCI VPS)
# — see docs/guides/db-migration-to-oci.md and
# ../../nodes/anno-db-oci-01/README.md for that node's specifics.
#
# SECURITY: every port below is bound to ${TAILSCALE_IP} only — never to
# 0.0.0.0 — so these databases are unreachable except over the tailnet.
# Do NOT open 5432/3306/6379/5984/9000/9001 in the host's cloud firewall.

name: core-data

networks:
  core-data:
    driver: bridge

volumes:
  # Explicit `name:` (same as the key) so these are bare "postgres_data" etc
  # with no compose-project prefix — matches the tarball names coming off
  # a recovered SD card 1:1, no renaming needed during restore.
  postgres_data:
    name: postgres_data
  mariadb_data:
    name: mariadb_data
  redis_data:
    name: redis_data
  minio_data:
    name: minio_data
  couchdb_data:
    name: couchdb_data
  # mongodb_data:
  #   name: mongodb_data
  # Uncomment only if an SD-card extraction's MANIFEST.txt showed real data
  # in a mongo volume — the pre-migration core-data stack declared this
  # volume but had no mongo service using it.

services:
  postgres:
    # Pin the major version to match whatever's actually in postgres_data —
    # Postgres data directories are NOT portable across major versions.
    # 18+ images manage their own version-specific subdir (e.g.
    # 18/docker/) under this mount rather than using it directly as PGDATA —
    # do not mount this at .../postgresql/data, only at .../postgresql
    # itself, or the 18+ entrypoint will refuse to start
    # (see https://github.com/docker-library/postgres/pull/1259).
    image: postgres:18-alpine
    container_name: core-data-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./configs/postgres/init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "${TAILSCALE_IP}:5432:5432"
    networks:
      - core-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  mariadb:
    image: mariadb:11-jammy
    container_name: core-data-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./configs/mariadb/init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "${TAILSCALE_IP}:3306:3306"
    networks:
      - core-data
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    # The original pre-migration stack used `redis:latest` (unpinned), and
    # the recovered dump.rdb is RDB format version 15 - newer than 7.x can
    # read. Track `latest` here too rather than re-pinning an older tag that
    # can't load the restored data (see docs/guides/db-migration-to-oci.md).
    image: redis:latest
    container_name: core-data-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${TAILSCALE_IP}:6379:6379"
    networks:
      - core-data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s

  couchdb:
    image: couchdb:latest
    container_name: core-data-couchdb
    restart: unless-stopped
    # Matches the data directory's expected ownership.
    user: 5984:5984
    # No COUCHDB_USER/COUCHDB_PASSWORD here on purpose: the mounted
    # local.d/docker.ini already carries a real [admins] entry with a
    # pre-hashed password from the original deployment. The official image
    # writes COUCHDB_USER/COUCHDB_PASSWORD as plaintext into this same file
    # on every start, which would collide with (or clobber) that entry.
    # To rotate the admin password later, do it via the CouchDB HTTP API
    # (PUT /_node/_local/_config/admins/<user>) after this is up, not here
    # — and remember Obsidian LiveSync's client config needs updating too.
    #
    # Mount is read-write (not :ro) on purpose: the entrypoint unconditionally
    # touches local.d/docker.ini on every start regardless of whether the
    # admin env vars are set - :ro here causes a permission-denied crash loop.
    volumes:
      - couchdb_data:/opt/couchdb/data
      - ./configs/couchdb/local.d:/opt/couchdb/etc/local.d
    ports:
      - "${TAILSCALE_IP}:5984:5984"
    networks:
      - core-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5984/"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: core-data-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${TAILSCALE_IP}:9000:9000"
      - "${TAILSCALE_IP}:9001:9001"
    networks:
      - core-data

  node-exporter:
    image: prom/node-exporter:latest
    container_name: core-data-node-exporter
    restart: unless-stopped
    pid: "host"
    volumes:
      - '/:/host:ro,rslave'
      - '/proc:/host/proc:ro'
      - '/sys:/host/sys:ro'
    ports:
      - "${TAILSCALE_IP}:9100:9100"
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containerd/.+)($$|/)'
    networks:
      - core-data
