# Ollama systemd drop-in for ai-jacaranda (Jetson Orin Nano, 8 GB shared CPU/GPU RAM).
# Install path: /etc/systemd/system/ollama.service.d/override.conf   (see README.md)
#
# STATUS: PROPOSED — not yet applied (needs sudo). Only OLLAMA_HOST was live when this
# was written. The rest target the memory pressure seen on this box: three models stayed
# resident after a few test calls and left <600 MB free.
[Service]
# Reachable from Docker (host-gateway) and over Tailscale. NOTE: unauthenticated —
# firewall :11434 to the docker bridge + tailnet if this box sits on an untrusted LAN.
Environment="OLLAMA_HOST=0.0.0.0"

# Chat model + embedding model (Open WebUI RAG) can be resident together; a 3rd evicts one.
Environment="OLLAMA_MAX_LOADED_MODELS=2"
# One request at a time per model — parallel slots multiply KV-cache RAM.
Environment="OLLAMA_NUM_PARALLEL=1"
# Free RAM sooner than the 5m default (LiteLLM/Open WebUI reload on demand).
Environment="OLLAMA_KEEP_ALIVE=2m"
# Smaller KV cache: flash attention + 8-bit K/V.
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"

# Models currently load with a 4096-token window, so long RAG prompts are silently
# truncated. Raising it costs RAM roughly linearly — try 8192 once the above is in:
# Environment="OLLAMA_CONTEXT_LENGTH=8192"
