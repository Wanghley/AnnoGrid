services:
  # Home Assistant was removed from this node entirely (2026-09-29): ai-jacaranda is scoped
  # to AI + monitoring only. The Wyoming voice services below (whisper/piper/openwakeword)
  # are kept, but nothing on this node consumes them any more.

  # The Ears: NVIDIA Optimized Whisper
  whisper:
    container_name: whisper
    image: dustynv/wyoming-whisper:r36.2.0
    runtime: nvidia
    network_mode: host
    entrypoint: ["python3", "-m", "wyoming_faster_whisper"]
    command: ["--model", "base", "--language", "en", "--device", "cuda", "--data-dir", "/data", "--uri", "tcp://0.0.0.0:10300"]
    volumes:
      - ./whisper-data:/data
    restart: unless-stopped

  # The Voice: Piper
  piper:
    container_name: piper
    image: rhasspy/wyoming-piper
    command: ["--voice", "en_US-lessac-medium", "--uri", "tcp://0.0.0.0:10200"]
    volumes:
      - ./piper-data:/data
    network_mode: host
    restart: unless-stopped

  # The Wake Word Engine
  openwakeword:
    container_name: openwakeword
    image: rhasspy/wyoming-openwakeword
    network_mode: host
    restart: unless-stopped

  # Linux Voice Assistant (Hardware Bridge)
  # We build this locally to ensure ALSA (no PulseAudio) compatibility
  linux-voice-assistant:
    container_name: lva-arlo
    build: 
      context: ./lva-build
    network_mode: host
    privileged: true
    restart: unless-stopped
    env_file: .env
    environment:
      - SOUNDCARD_BACKEND=alsa
    group_add:
      - audio
    cap_add:
      - SYS_NICE
    devices:
      - "/dev/snd:/dev/snd"
    volumes:
      - wakeword_data:/app/local
      - configuration:/app/configuration
      - /etc/localtime:/etc/localtime:ro

volumes:
  wakeword_data:
  configuration:
